<!DOCTYPE html>
<html lang="en" style="background-color: bisque;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Influencer</title>
    <link rel="stylesheet" href="/static/css/create_influencer.css">
</head>
<body>
    {% if message != '' %}
    <script> alert('{{ message|capitalize }}')</script>
    {% endif %}
    <form action="/create_influencer" method="post">
        <h1>Sign Up</h1><br>

        <label for="name">Influencer name</label>
        <input name="name" id="name" type="text" placeholder="Enter name here" maxlength="20" required><br>

        <label for="email">Influencer email</label>
        <input name="email" id="email" type="text" placeholder="Enter email address here" maxlength="30" required><br>
        
        <label for="username">Influencer username</label>
        <input name="username" id="username" type="text" placeholder="Enter username here" maxlength="16" required><br>

        <label for="password">Influencer password</label>
        <input name="password" id="password" type="text" placeholder ="Enter password here" minlength="8" maxlength="16" required><br>

        <div style="margin-top: 0.5vw;margin-bottom: 0.5vw;"> 
            <label for="niche">Influencer niche</label>
            <select name="niche" id="niche">
                <option value="Technology">Technology</option>
                <option value="Education">Education</option>
                <option value="Fashion">Fashion</option>
                <option value="Fitness">Fitness</option>
                <option value="Finance">Finance</option>
                <option value="Gaming">Gaming</option>
            </select>
        </div>
        <div style="margin-top: 0.5vw;margin-bottom: 0.5vw;">
            <label for="follower_count">Influencer reach</label>
            <select name="follower_count" id="follower_count">
                <option value="&lt;= 50K">&lt;= 50K</option>
                <option value="&gt; 50K &lt;= 100K">&gt; 50K &lt;= 100K</option>
                <option value="&gt; 100K">&gt; 100K</option>
            </select>
        </div>
        <button type="submit">Sign Up</button><br>

        <a href="/login_influencer" style="color: red;text-decoration: underline;font-size: medium;font-weight: bold;font-family: cursive; 
        position: relative;left: -25%;margin-top: 0.5vw;margin-bottom: 0.5vw;">Go back ?</a>
    </form>
</body>
</html>
